<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0f5c46">
    <title>{{ title }} | Cholo Bd</title>
    <style>
        :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17352b; background: #f6f8f3; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 50% 0, #dceee5, #f6f8f3 48%); }
        main { width: min(100%, 38rem); text-align: center; padding: clamp(2.2rem, 7vw, 4.5rem); background: #fff; border: 1px solid #d9e5de; border-radius: 1.5rem; box-shadow: 0 1.5rem 4rem rgba(25,69,51,.12); }
        .brand { display: inline-flex; align-items: center; gap: .6rem; color: #0f5c46; font-weight: 800; font-size: 1.1rem; }
        .mark { display: grid; place-items: center; width: 2.3rem; height: 2.3rem; color: #fff; border-radius: .7rem; background: #0f5c46; }
        h1 { margin: 1.6rem 0 .75rem; font-size: clamp(1.9rem, 7vw, 3rem); line-height: 1.1; }
        p { color: #587267; line-height: 1.7; margin: 0 auto 1.8rem; }
        a { display: inline-block; padding: .82rem 1.25rem; color: #fff; background: #0f5c46; border-radius: .75rem; text-decoration: none; font-weight: 700; }
        a:focus-visible { outline: 3px solid #efad35; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="mark" aria-hidden="true">⌖</span>Cholo Bd</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a href="/">Return to Cholo Bd</a>
    </main>
</body>
</html>
