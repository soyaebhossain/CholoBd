<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f5c46">
    <title>You are offline | Cholo Bd</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; color: #17352b; background: radial-gradient(circle at top, #e3f1e9, #f7f9f5 48%); }
        main { width: min(100%, 34rem); padding: clamp(2rem, 7vw, 4rem); text-align: center; border: 1px solid #d7e4dc; border-radius: 1.5rem; background: rgba(255,255,255,.94); box-shadow: 0 1.5rem 4rem rgba(22,70,52,.12); }
        img { width: 5rem; height: 5rem; }
        h1 { margin: 1.25rem 0 .7rem; font-size: clamp(1.8rem, 7vw, 2.6rem); }
        p { margin: 0 auto 1.6rem; max-width: 28rem; color: #527064; line-height: 1.7; }
        button { border: 0; border-radius: .75rem; padding: .8rem 1.25rem; color: #fff; background: #0f5c46; font: inherit; font-weight: 700; cursor: pointer; }
        button:focus-visible { outline: 3px solid #efad35; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/static/images/app-icon.svg" alt="">
        <h1>You are offline</h1>
        <p>Cholo Bd cannot reach the network right now. Your private travel pages are never stored for offline access. Reconnect and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
