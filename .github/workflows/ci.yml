name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-secret-key-that-is-not-used-outside-tests"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        working-directory: bd_travel_tracker
      - run: python manage.py check
        working-directory: bd_travel_tracker
      - run: python manage.py test
        working-directory: bd_travel_tracker
